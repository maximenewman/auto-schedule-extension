<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 14px/1.5 system-ui; max-width: 520px; padding: 24px; }
    input { width: 100%; padding: 6px; font: inherit; }
    button { padding: 8px 16px; cursor: pointer; margin-top: 8px; }
    .muted { color: #666; font-size: 12px; }
    .status { margin-top: 8px; }
    .ok { color: #1f8a5b; }
    .err { color: #c43; }
  </style>
</head>
<body>
  <h1>auto-schedule settings</h1>
  <p class="muted">URL of your auto-schedule instance.</p>
  <input id="url" placeholder="https://auto-schedule.fly.dev" />
  <button id="save">Save</button>
  <div class="status" id="status"></div>
  <script src="options.js"></script>
</body>
</html>
